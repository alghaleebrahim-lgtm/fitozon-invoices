<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نظام فواتير أعمال فيتوزون التجارية</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
:root{--y:#FFD600;--y2:#FFF3A8;--k:#000;--bg:#F4F4F2;--line:#E4E4E0;--muted:#6A6A66;--red:#D42F2F;--r:12px}
html,body{margin:0;background:var(--bg);color:var(--k);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--k);outline-offset:2px}
.ic{width:18px;height:18px;flex:none}
[dir=rtl] .flip{transform:scaleX(-1)}
bdi{unicode-bidi:isolate}

/* Topbar */
#topbar{position:sticky;top:0;z-index:40;background:var(--k);color:#fff;display:flex;align-items:center;gap:18px;padding:10px 24px;border-bottom:4px solid var(--y)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;white-space:nowrap}
.brand img{width:40px;height:40px;border-radius:10px}
.brand small{display:block;font-weight:400;color:#B8B8B0;font-size:11px;line-height:1.2}
.nav{display:flex;gap:4px;margin-inline-start:auto;overflow-x:auto;scrollbar-width:none}
.nav button{background:transparent;border:0;color:#CFCFC8;padding:8px 12px;border-radius:9px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap;transition:background .15s,color .15s}
.nav button:hover{color:#fff;background:#1A1A1A}
.nav button.on{background:var(--y);color:var(--k);font-weight:600}
.lang{border:1px solid #3A3A3A;background:transparent;color:#fff;border-radius:9px;padding:7px 12px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap}
.lang:hover{border-color:var(--y)}

main{max-width:1440px;margin:0 auto;padding:24px}
.enter{animation:enter .28s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
h1{margin:0;font-size:24px;line-height:1.3}
.muted{color:var(--muted)}
.sm{font-size:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.end{justify-content:flex-end}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:#fff;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--k)}
.btn:active{transform:scale(.98)}
.btn.yellow{background:var(--y);border-color:var(--y);color:var(--k)}
.btn.yellow:hover{border-color:var(--k)}
.btn.dark{background:var(--k);color:#fff;border-color:var(--k)}
.btn.dark:hover{background:#222}
.btn.ghost{background:transparent}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger-ghost{color:var(--red)}
.btn.danger-ghost:hover{border-color:var(--red);background:#FFF1F1}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.lg{padding:14px 22px;font-size:15px}
.icon-btn{width:34px;height:34px;display:inline-grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;transition:background .15s,border-color .15s}
.icon-btn .ic{width:16px;height:16px}
.icon-btn:hover{background:var(--y);border-color:var(--y)}
.icon-btn.del:hover{background:var(--red);color:#fff;border-color:var(--red)}
.back{background:none;border:0;padding:0;margin-bottom:6px;display:flex;align-items:center;gap:4px;color:var(--muted);cursor:pointer}
.back:hover{color:var(--k)}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:14px}
.card h3{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:10px}
.card h3 .bar{width:4px;height:16px;background:var(--y);border-radius:2px}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.card-head h3{margin:0}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field>span,.mini>span{font-size:12px;color:var(--muted);font-weight:500}
em{color:var(--red);font-style:normal}
input,select,textarea{width:100%;border:1px solid var(--line);background:#FAFAF8;border-radius:9px;padding:9px 12px;outline:none;transition:border-color .15s,box-shadow .15s;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--k);background:#fff;box-shadow:0 0 0 3px rgba(255,214,0,.55)}
input[readonly]{background:#F0F0EC;color:var(--muted)}
textarea{min-height:80px;resize:vertical}
input[type=number]::-webkit-inner-spin-button{opacity:.4}
.invalid{border-color:var(--red)!important;background:#FFF5F5!important}
.err{color:var(--red);font-size:12px}
.err:empty{display:none}
.banner{background:var(--y2);border:1px solid var(--y);padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px}

/* Dashboard */
.hero{background:var(--k);color:#fff;border-radius:16px;padding:30px 32px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:24px;margin-bottom:14px;position:relative;overflow:hidden}
.hero h1{font-size:28px;max-width:560px}
.hero p{color:#BDBDB5;margin:8px 0 0;max-width:520px}
.hero .ring{position:absolute;inset-inline-end:180px;top:-70px;width:200px;height:200px;border-radius:50%;border:34px solid var(--y);opacity:.9;pointer-events:none}
.hero>*:not(.ring){position:relative}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stat .l{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}
.stat .l .ic{color:var(--k);background:var(--y);border-radius:6px;padding:3px;width:22px;height:22px}
.stat .v{font-size:24px;font-weight:700;margin-top:10px}
.stat .v .sub{font-size:12px;font-weight:500;color:var(--muted)}
.dash-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
.quick{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color .15s}
.quick:hover{border-color:var(--k)}
.quick .qi{width:40px;height:40px;border-radius:10px;background:var(--bg);display:grid;place-items:center}
.quick.primary{background:var(--y);border-color:var(--y)}
.quick.primary .qi{background:var(--k);color:var(--y)}
.quick b{display:block}
.quick small{color:var(--muted)}
.quick.primary small{color:#3A3A00}

/* Tables */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;min-width:720px}
.tbl th{text-align:start;font-size:12px;color:var(--muted);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#FBFBF7}
.num-id{font-weight:600;cursor:pointer;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.num-id:hover{text-decoration:underline;text-decoration-color:var(--y);text-decoration-thickness:3px}
.actions{display:flex;gap:5px}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.b-unpaid{background:#FDECEC;color:#B42323}.b-partial{background:#FFF1CC;color:#8F5A00}.b-paid{background:#E2F5EA;color:#136B40}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .ic{width:36px;height:36px;color:#BBB}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end}
.search{position:relative}
.search .ic{position:absolute;inset-inline-start:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px}
.search input{padding-inline-start:36px}

/* Editor */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.preview-col{align-self:stretch}
.preview-col .sticky{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;padding-bottom:10px}
.preview-label{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:8px}
.live{width:8px;height:8px;border-radius:50%;background:#1DB954;box-shadow:0 0 0 3px rgba(29,185,84,.2)}
.preview-wrap{position:relative;overflow:hidden;border-radius:8px;background:#fff;border:1px solid var(--line);box-shadow:0 18px 40px rgba(0,0,0,.08)}
.a4-scale{position:absolute;top:0;left:0;width:794px;transform-origin:0 0}
.mtabs{display:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:12px}
.mtabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:7px;cursor:pointer;font-weight:600}
.mtabs button.on{background:var(--k);color:var(--y)}
.co-mini{display:flex;gap:12px;align-items:center}
.co-mini img{width:48px;height:48px;border-radius:10px}
.co-mini a{color:var(--k);cursor:pointer;text-decoration:underline;text-decoration-color:var(--y);text-decoration-thickness:2px;font-size:12px}
.item{display:grid;grid-template-columns:26px repeat(3,minmax(0,1fr)) 34px;grid-template-areas:"no name name desc desc" "no qty price total del";gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#FCFCFA;animation:enter .2s ease-out}
.item .no{grid-area:no;width:24px;height:24px;border-radius:6px;background:var(--k);color:var(--y);display:grid;place-items:center;font-size:12px;font-weight:700}
.a-name{grid-area:name}.a-desc{grid-area:desc}.a-qty{grid-area:qty}.a-price{grid-area:price}.a-total{grid-area:total}.a-del{grid-area:del;align-self:end;margin-bottom:2px}
.mini{display:flex;flex-direction:column;gap:4px;min-width:0}
.line-total{padding:9px 10px;border-radius:9px;background:var(--y2);font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.add-item{width:100%;border:1.5px dashed #C9C9C2;background:transparent;padding:11px;border-radius:10px;cursor:pointer;font-weight:600;display:flex;gap:8px;justify-content:center;align-items:center}
.add-item:hover{border-color:var(--k);background:var(--y2)}
.sumbox{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}
.sumbox .r{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}
.sumbox .r b{color:var(--k)}
.sumbox .g{display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:700;background:var(--k);color:#fff;border-radius:10px;padding:12px 14px;margin-top:8px}
.sumbox .g b{color:var(--y);font-size:20px}

/* Settings */
.uploads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.upload{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:12px}
.thumb{width:92px;height:92px;flex:none;border-radius:10px;border:1px dashed #CFCFC8;display:grid;place-items:center;overflow:hidden;background:repeating-conic-gradient(#EFEFEA 0 25%,#fff 0 50%) 0 0/14px 14px;color:#AAA}
.thumb img{max-width:100%;max-height:100%}
.upload-info{display:flex;flex-direction:column;gap:6px;min-width:0}
.next-no{display:inline-block;background:var(--k);color:var(--y);padding:3px 10px;border-radius:7px;font-weight:600;direction:ltr}

/* Invoice view page */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px}
.inv-page{max-width:860px;margin:0 auto}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:90;display:grid;place-items:center;padding:16px;animation:enter .15s}
.dialog{background:#fff;border-radius:14px;padding:22px;max-width:430px;width:100%}
.dialog h3{margin:0 0 6px}
.dialog p{margin:0 0 16px}
.dialog.wide{max-width:900px;max-height:92vh;overflow:auto;padding:14px}
.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dialog .fi{width:48px;height:48px;border-radius:12px;background:var(--y);display:grid;place-items:center;margin-bottom:12px}
#busy{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.72);color:#fff;display:none;place-items:center;text-align:center}
#busy.on{display:grid}
.spinner{width:40px;height:40px;border:4px solid #333;border-top-color:var(--y);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.t{background:var(--k);color:#fff;padding:10px 16px;border-radius:10px;animation:enter .2s;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.t:before{content:'';width:8px;height:8px;border-radius:50%;background:var(--y);flex:none}
.t.err{background:var(--red)}
.t.err:before{background:#fff}
#print-root{display:none}
#pdf-stage{position:fixed;top:0;left:0;z-index:-10;pointer-events:none}

/* Login & loading */
.login{min-height:calc(100vh - 130px);display:grid;place-items:center}
.login-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:32px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px}
.login-card img{width:64px;height:64px;border-radius:14px}
.login-card h1{font-size:22px}
.login-card p{margin:-8px 0 4px}
.loading{padding:80px 0;display:grid;place-items:center;color:var(--muted)}
.loading .spinner{border-color:#DDD;border-top-color:#000}
.logout{background:transparent;border:0;color:#B8B8B0;cursor:pointer;display:flex;gap:6px;align-items:center;padding:7px 8px;border-radius:9px}
.logout:hover{color:#fff;background:#1A1A1A}

/* Responsive */
@media(max-width:1100px){.dash-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.uploads{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.filters .field:first-child{grid-column:1/-1}}
@media(max-width:1024px){
  .split{grid-template-columns:1fr}
  .mtabs{display:flex}
  .split[data-mtab=form] .preview-col{display:none}
  .split[data-mtab=preview] .form-col{display:none}
  .preview-col .sticky{position:static;max-height:none;overflow:visible}
}
@media(max-width:640px){
  main{padding:14px}
  #topbar{padding:10px 14px;flex-wrap:wrap;gap:10px}
  .nav{order:3;width:100%;margin:0}
  .lang{margin-inline-start:auto}
  .grid,.grid.g3{grid-template-columns:1fr}
  .grid.g3.fees{grid-template-columns:1fr 1fr}
  .hero{grid-template-columns:1fr;padding:24px}
  .hero h1{font-size:22px}
  .hero .ring{inset-inline-end:-60px}
  .stat .v{font-size:19px}
  .head-actions{width:100%}.head-actions .btn{flex:1}
  .item{grid-template-columns:24px repeat(3,minmax(0,1fr)) 34px;grid-template-areas:"no name name name name" "no desc desc desc desc" "no qty price total del"}
  .toolbar .btn{flex:1 1 40%}
}

/* ============ INVOICE (A4 @96dpi = 794px) ============ */
.inv{width:794px;min-height:1120px;background:#fff;color:#111;font-family:'IBM Plex Sans Arabic',sans-serif;font-size:12.5px;line-height:1.55;display:flex;flex-direction:column;text-align:start}
.inv *{box-sizing:border-box}
.inv-top{display:flex;justify-content:space-between;align-items:flex-start;padding:38px 44px 24px;gap:20px}
.inv-brand{display:flex;gap:14px;align-items:center}
.inv-logo{width:78px;height:78px;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#FFD600;flex:none}
.inv-logo img{max-width:78px;max-height:78px}
.inv-co{font-size:20px;font-weight:700;line-height:1.3}
.inv-co-alt{font-size:12px;color:#777}
.inv-contact{margin-top:4px;color:#555;font-size:11px;line-height:1.7}
.inv-title{text-align:end;flex:none}
.inv-word{font-size:36px;font-weight:700;line-height:1.1}
.inv-no{display:inline-block;margin-top:10px;background:#000;color:#FFD600;padding:5px 12px;border-radius:8px;font-weight:700;font-size:13px}
.inv-band{display:flex;height:6px;margin:0 44px}
.inv-band i{display:block;height:6px}
.inv-meta{display:flex;gap:16px;padding:22px 44px}
.inv-box{border:1px solid #E8E8E8;border-radius:12px;padding:14px 16px;flex:1}
.inv-box.wide{flex:1.3}
.inv-box h4{margin:0 0 6px;font-size:11.5px;color:#888;font-weight:600}
.inv-client{font-size:15px;font-weight:700;margin-bottom:2px}
.inv-kv{display:flex;justify-content:space-between;padding:2px 0;gap:10px}
.inv-kv span{color:#777}
.inv-kv b{font-weight:600}
.inv-items{padding:0 44px}
.inv-table{width:100%;border-collapse:collapse}
.inv-table th{background:#000;color:#fff;font-weight:600;font-size:11.5px;padding:10px 10px;text-align:start}
.inv-table th.c,.inv-table td.c{text-align:center}
.inv-table td{padding:10px;border-bottom:1px solid #EFEFEF;vertical-align:top}
.inv-table tr.alt td{background:#FAFAF5}
.inv-table .idx{width:34px;color:#888}
.inv-table .dsc{color:#666;font-size:11.5px}
.inv-table tr{page-break-inside:avoid}
.inv-bottom{display:flex;gap:26px;padding:22px 44px 10px;align-items:flex-start}
.inv-notes{flex:1}
.inv-notes h4{margin:0 0 4px;font-size:12px}
.inv-notes p{margin:0 0 14px;color:#555;white-space:pre-wrap;font-size:11.5px;line-height:1.75}
.inv-totals{width:300px;flex:none}
.inv-totals .tr{display:flex;justify-content:space-between;padding:6px 2px;border-bottom:1px dashed #E3E3E3}
.inv-totals .tr span{color:#666}
.inv-grand{margin-top:10px;background:#000;color:#fff;border-radius:12px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center}
.inv-grand b{color:#FFD600;font-size:20px}
.inv-grand small{color:#FFD600;font-size:11px;font-weight:600}
.inv-sign{display:flex;gap:30px;padding:18px 44px 22px;margin-top:auto}
.inv-sig{flex:1;text-align:center}
.inv-sig .img{height:112px;display:flex;align-items:center;justify-content:center}
.inv-sig img{max-height:112px;max-width:230px}
.inv-sig .ln{border-top:1.5px solid #111;margin:6px 50px 6px}
.inv-foot{background:#FFD600;padding:12px 44px;display:flex;justify-content:space-between;gap:16px;font-size:11px;font-weight:600;color:#000}

@media print{
  body{background:#fff}
  body>*:not(#print-root){display:none!important}
  #print-root{display:block!important}
  @page{size:A4;margin:0}
  .inv{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header id="topbar"></header>
<main id="app"></main>
<div id="modal"></div>
<div id="busy"><div><div class="spinner"></div><div id="busyText"></div></div></div>
<div id="toast"></div>
<div id="print-root"></div>
<div id="pdf-stage"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* =========================================================
   نظام فواتير أعمال فيتوزون التجارية
   Layers: i18n → Storage Adapter → Repository → Domain (calc) → Views
   To move to a server DB later: implement a new adapter with the same
   methods (init/getMeta/setMeta/listInvoices/saveInvoice/deleteInvoice)
   and assign it inside Repo.init(). Nothing else changes.
   ========================================================= */

/* ---------------- Domain ---------------- */
function calc(inv){
  const lines=inv.items.map(it=>r2(num(it.qty)*num(it.price)));
  const sub=r2(lines.reduce((a,b)=>a+b,0));
  const f=inv.fees;
  const fees=r2(num(f.shipping)+num(f.service)+num(f.delivery)+num(f.customs)+num(f.other));
  const discount=r2(num(f.discount));
  const total=r2(Math.max(0,sub+fees-discount));
  const paid=inv.status==='paid'?total:inv.status==='partial'?r2(Math.min(num(inv.paidAmount),total)):0;
  return {lines,sub,fees,discount,total,paid,due:r2(total-paid)};
}

/* html2canvas paints text word-by-word in LTR, which shifts Arabic words and
   swallows the spaces between them. On the off-screen PDF copy only, wrap each
   Arabic word in its own span (spaces stay as real text between spans) and
   anchor it with RLM marks so punctuation stays on the correct side. */
function fixArabicSpacing(root){
  const AR=/[\u0600-\u06FF]/, w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), nodes=[];
  while(w.nextNode()) if(AR.test(w.currentNode.nodeValue)) nodes.push(w.currentNode);
  nodes.forEach(n=>{
    const frag=document.createDocumentFragment();
    n.nodeValue.split(/(\s+)/).forEach(tok=>{
      if(!tok) return;
      if(/^\s+$/.test(tok)){frag.appendChild(document.createTextNode(tok));return}
      const sp=document.createElement('span');
      sp.textContent=AR.test(tok)?'\u200F'+tok+'\u200F':tok;
      frag.appendChild(sp);
    });
    n.parentNode.replaceChild(frag,n);
  });
}
async function buildPdf(inv){
  if(!window.html2pdf) throw new Error('html2pdf not loaded');
  busy(true);
  const stage=$('#pdf-stage');
  try{
    try{await document.fonts.ready}catch(e){}
    stage.innerHTML=renderInvoice(inv,S.settings,S.lang);
    await waitImages(stage);
    fixArabicSpacing(stage);
    return await html2pdf().set({
      margin:0, filename:fileName(inv),
      image:{type:'jpeg',quality:0.97},
      html2canvas:{scale:3,useCORS:true,backgroundColor:'#ffffff',scrollX:0,scrollY:0},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait',compress:true},
      pagebreak:{mode:['css','legacy'],avoid:['tr','.inv-bottom','.inv-sign']}
    }).from(stage.firstElementChild).outputPdf('blob');
  } finally { stage.innerHTML=''; busy(false); }
}

    m.innerHTML=`<div class="overlay"><div class="dialog"><h3>${t('confirmTitle')}</h3><p>${msg}</p><div class="row end"><button class="btn ghost" id="mNo">${t('cancel')}</button><button class="btn danger" id="mYes">${ic('trash')}${t('delete')}</button></div></div></div>`;
    const close=v=>{m.innerHTML='';res(v)}; $('#mNo').onclick=()=>close(false); $('#mYes').onclick=()=>close(true);});
}
function openPreview(inv){
  const m=$('#modal');
  m.innerHTML=`<div class="overlay"><div class="dialog wide"><div class="dialog-head"><b><bdi dir="ltr">${esc(inv.number)}</bdi></b><button class="icon-btn" data-close>${ic('x')}</button></div><div class="preview-wrap"><div class="a4-scale">${renderInvoice(inv,S.settings,S.lang)}</div></div></div></div>`;
  m.onclick=e=>{if(e.target.closest('[data-close]')||e.target.classList.contains('overlay')){m.innerHTML='';m.onclick=null}};
  requestAnimationFrame(fitPreview); waitImages(m).then(fitPreview);
}
function fitPreview(){
  $$('.preview-wrap').forEach(w=>{const s=w.querySelector('.a4-scale');if(!s||!w.clientWidth)return;const sc=w.clientWidth/794;s.style.transform=`scale(${sc})`;w.style.height=(s.offsetHeight*sc)+'px'});
}

function fld(label,path,o={}){
  const v=getPath(S.draft,path); let input;
  if(o.select) input=`<select data-bind="${path}">${o.select.map(([val,lab])=>`<option value="${val}" ${v===val?'selected':''}>${lab}</option>`).join('')}</select>`;
  else if(o.textarea) input=`<textarea data-bind="${path}">${esc(v)}</textarea>`;
  else input=`<input data-bind="${path}" type="${o.type||'text'}" value="${esc(v)}" ${o.type==='number'?'min="0" step="any" inputmode="decimal" placeholder="0"':''} ${o.ltr?'dir="ltr"':''}>`;
  return `<label class="field ${o.full?'full':''}" ${o.id?`id="${o.id}"`:''} ${o.hidden?'style="display:none"':''}><span>${label}${o.req?' <em>*</em>':''}</span>${input}<small class="err" data-err="${path}"></small></label>`;
}

function flagErr(path,msg){const i=$(`[data-bind="${path}"]`);if(i)i.classList.add('invalid');const e=$(`[data-err="${path}"]`);if(e)e.textContent=msg}
function clearErr(path){const i=$(`[data-bind="${path}"]`);if(i)i.classList.remove('invalid');const e=$(`[data-err="${path}"]`);if(e)e.textContent=''}
function validate(){
  const d=S.draft; let bad=false;
  $$('.invalid').forEach(x=>x.classList.remove('invalid')); $$('[data-err]').forEach(x=>x.textContent=''); $('#itemsErr').textContent='';
  ['client.name','client.phone','issueDate'].forEach(p=>{if(!String(getPath(d,p)||'').trim()){flagErr(p,t('required'));bad=true}});
  if(d.client.email&&!/^\S+@\S+\.\S+$/.test(d.client.email)){flagErr('client.email',t('badEmail'));bad=true}
  if(d.dueDate&&d.issueDate&&d.dueDate<d.issueDate){flagErr('dueDate',t('dueBefore'));bad=true}
  d.items.forEach((it,i)=>{ if(!isFilled(it)) return;
    if(!String(it.name||'').trim()){$(`[data-item="${i}"][data-f="name"]`).classList.add('invalid');bad=true}
    if(!(num(it.qty)>0)){$(`[data-item="${i}"][data-f="qty"]`).classList.add('invalid');bad=true} });
  if(!d.items.some(it=>String(it.name||'').trim()&&num(it.qty)>0)){$('#itemsErr').textContent=t('needItem');bad=true}
  if(d.status==='partial'){const c=calc(d);if(!(num(d.paidAmount)>0&&num(d.paidAmount)<c.total)){flagErr('paidAmount',t('badPaid'));bad=true}}
  if(bad){
    toast(t('fixErrors'),'err');
    if(S.mobileTab==='preview'){S.mobileTab='form';$('.split').dataset.mtab='form';$$('.mtabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab==='form'))}
    const first=$('.invalid')||$('#itemsErr'); first?.scrollIntoView({behavior:'smooth',block:'center'});
  }
  return !bad;
}
async function saveDraft(){
  if(!validate()) return null;
  const d=S.draft, now=new Date().toISOString();
  d.items=d.items.filter(isFilled);
  if(d.status!=='partial') d.paidAmount='';
  if(!S.editingId){d.number=await Repo.nextNumber(false);d.id=uid();d.createdAt=now}
  d.updatedAt=now;
  await Repo.saveInvoice(d); S.editingId=d.id;
  return structuredClone(d);
}

function onKey(e){ if(e.target.type==='number'&&['-','e','E','+'].includes(e.key)) e.preventDefault(); }
function onInput(e){
  const el=e.target;
  if(S.view==='editor'){
    if(el.dataset.bind){
      let v=el.value; const p=el.dataset.bind;
      if(el.type==='number'&&parseFloat(v)<0){el.value='';v='';flagErr(p,t('noNegative'))} else clearErr(p);
      setPath(S.draft,p,v);
      if(p==='status'){const w=$('#paidWrap');if(w)w.style.display=v==='partial'?'':'none'}
      updatePreview();
    } else if(el.dataset.item!==undefined){
      const i=+el.dataset.item; let v=el.value;
      if(el.type==='number'&&parseFloat(v)<0){el.value='';v='';toast(t('noNegative'),'err')}
      S.draft.items[i][el.dataset.f]=v; el.classList.remove('invalid'); $('#itemsErr').textContent='';
      const lt=$(`[data-line="${i}"]`); if(lt) lt.textContent=fmt(r2(num(S.draft.items[i].qty)*num(S.draft.items[i].price)));
      updatePreview();
    }
  }
  if(S.view==='list'&&el.dataset.filter){S.filters[el.dataset.filter]=el.value;renderListRows()}
  if(S.view==='settings'&&el.dataset.set){S.settingsDraft[el.dataset.set]=el.value}
}
async function onChange(e){
  const el=e.target; if(!el.dataset.upload) return;
  const file=el.files[0]; if(!file) return;
  if(!file.type.startsWith('image/')) return toast(t('badImage'),'err');
  if(file.size>3*1024*1024) return toast(t('tooBig'),'err');
  S.settingsDraft[el.dataset.upload]=await resizeImage(await readFile(file));
  await render();
  toast(el.dataset.upload!=='logo'&&file.type!=='image/png'?t('pngTip'):t('uploaded'));
}
async function onClick(e){
  try{ await handleClick(e); }
  catch(err){ console.error(err); busy(false); toast(t('netErr'),'err'); }
}
async function handleClick(e){
  const tab=e.target.closest('[data-tab]');
  if(tab){S.mobileTab=tab.dataset.tab;$$('.mtabs button').forEach(b=>b.classList.toggle('on',b===tab));$('.split').dataset.mtab=S.mobileTab;fitPreview();return}
  const a=e.target.closest('[data-action]'); if(!a) return;
  const id=a.dataset.id;
  switch(a.dataset.action){
    case 'go': navigate(a.dataset.view); break;
    case 'new': S.draft=await newDraft(); S.editingId=null; S.mobileTab='form'; navigate('editor'); break;
    case 'add-item': S.draft.items.push({name:'',desc:'',qty:1,price:''}); renderItems(); updatePreview(); $$('[data-f="name"]').pop()?.focus(); break;
    case 'del-item': if(S.draft.items.length===1) S.draft.items[0]={name:'',desc:'',qty:1,price:''}; else S.draft.items.splice(+a.dataset.i,1); renderItems(); updatePreview(); break;
    case 'cancel': S.editingId?navigate('invoice',{invoiceId:S.editingId}):navigate('dashboard'); break;
    case 'save': { const inv=await saveDraft(); if(inv){toast(t('saved'));navigate('invoice',{invoiceId:inv.id})} break; }
    case 'save-pdf': { const inv=await saveDraft(); if(inv){toast(t('saved'));await downloadPdf(inv);navigate('invoice',{invoiceId:inv.id})} break; }
    case 'view': navigate('invoice',{invoiceId:id}); break;
    case 'preview': { const inv=await Repo.getInvoice(id); inv&&openPreview(inv); break; }
    case 'pdf': { const inv=await Repo.getInvoice(id); inv&&downloadPdf(inv); break; }
    case 'print': { const inv=await Repo.getInvoice(id); inv&&printInvoice(inv); break; }
    case 'share': { const inv=await Repo.getInvoice(id); inv&&shareInvoice(inv); break; }
    case 'edit': { const inv=await Repo.getInvoice(id); if(inv){S.draft=inv;S.editingId=inv.id;S.mobileTab='form';navigate('editor')} break; }
    case 'dup': { const inv=await Repo.getInvoice(id); if(!inv)break;
      Object.assign(inv,{id:null,number:await Repo.nextNumber(true),issueDate:todayISO(),dueDate:todayISO(+S.settings.dueDays||0),status:'unpaid',paidAmount:'',createdAt:null,updatedAt:null});
      S.draft=inv; S.editingId=null; S.mobileTab='form'; navigate('editor'); toast(t('duplicated')); break; }
    case 'del': { const inv=await Repo.getInvoice(id); if(!inv)break;
      if(await confirmBox(`${t('confirmDel')} <b><bdi dir="ltr">${esc(inv.number)}</bdi></b>`)){await Repo.deleteInvoice(id);toast(t('deleted'));S.view==='invoice'?navigate('list'):render()} break; }
    case 'clear-filters': S.filters={q:'',status:'',from:'',to:''}; render(); break;
    case 'lang': S.lang=S.lang==='ar'?'en':'ar'; localSet('lang',S.lang); render(); break;
    case 'logout': await sb.auth.signOut(); S.user=null; S.settings=null; S.draft=null; navigate('login'); break;
    case 'export': await exportData(); break;
    case 'remove-asset': S.settingsDraft[a.dataset.key]=a.dataset.key==='logo'?DEFAULT_LOGO:''; render(); break;
    case 'save-settings': {
      const d=S.settingsDraft, sn=Number(d.startNumber);
      if(!String(d.companyName||'').trim()) return toast(t('companyReq'),'err');
      if(!Number.isInteger(sn)||sn<1) return toast(t('badStart'),'err');
      d.startNumber=sn; d.dueDays=Math.max(0,parseInt(d.dueDays)||0);
      S.settings=structuredClone(d); await Repo.saveSettings(S.settings);
      toast(t('settingsSaved')); render(); break; }
  }
}

function resizeImage(dataUrl,max=700){
  return new Promise(res=>{const img=new Image();
    img.onload=()=>{const sc=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/png'))};
    img.onerror=()=>res(dataUrl); img.src=dataUrl;});
}
async function exportData(){
  busy(true);
  try{
    const [invoices,settings]=await Promise.all([Repo.listInvoices(),Repo.getSettings()]);
    saveBlob(new Blob([JSON.stringify({exportedAt:new Date().toISOString(),settings,invoices},null,2)],{type:'application/json'}),`fitozon-invoices-backup-${todayISO()}.json`);
    toast(t('exported'));
  } finally { busy(false); }
}
async function viewLogin(app){
  app.innerHTML=`<div class="login"><div class="login-card">
    <img src="${DEFAULT_LOGO}" alt="Fitozon"><h1>${t('loginTitle')}</h1><p class="muted">${t('loginSub')}</p>
    <label class="field"><span>${t('email')}</span><input id="lEmail" type="email" dir="ltr" autocomplete="username"></label>
    <label class="field"><span>${t('password')}</span><input id="lPass" type="password" dir="ltr" autocomplete="current-password"></label>
    <small class="err" id="lErr"></small>
    <button class="btn yellow lg" id="lBtn">${t('login')}</button>
  </div></div>`;
  const go=async()=>{
    const email=$('#lEmail').value.trim(), password=$('#lPass').value, btn=$('#lBtn');
    $('#lErr').textContent=''; if(!email||!password){$('#lErr').textContent=t('required');return}
    btn.disabled=true; btn.textContent=t('loading');
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error){ btn.disabled=false; btn.textContent=t('login'); $('#lErr').textContent=/invalid/i.test(error.message)?t('badLogin'):t('netErr'); return; }
    S.user=data.user; await boot();
  };
  $('#lBtn').onclick=go; $('#lPass').onkeydown=e=>{if(e.key==='Enter')go()};
  setTimeout(()=>$('#lEmail')?.focus(),50);
}
async function boot(){
  const app=$('#app'); renderTopbar();
  app.innerHTML=`<div class="loading"><div><div class="spinner"></div>${t('loading')}</div></div>`;
  try{ S.settings=await Repo.getSettings(); navigate('dashboard'); }
  catch(err){ console.error(err); app.innerHTML=`<div class="empty">${ic('x')}<p>${t('netErr')}</p><button class="btn dark" onclick="boot()">↻</button></div>`; }
}
async function init(){
  S.lang=localGet('lang')||'ar';
  document.documentElement.dir=S.lang==='ar'?'rtl':'ltr';
  const app=$('#app');
  app.addEventListener('input',onInput); app.addEventListener('click',onClick);
  app.addEventListener('change',onChange); app.addEventListener('keydown',onKey);
  $('#topbar').addEventListener('click',onClick);
  window.addEventListener('resize',fitPreview);
  if(document.fonts) document.fonts.ready.then(fitPreview);
  try{ Repo.init(); }
  catch(err){ renderTopbar(); app.innerHTML=`<div class="empty">${ic('x')}<p>${t('libErr')}</p></div>`; return; }
  const {data}=await sb.auth.getSession();
  S.user=data.session?.user||null;
  sb.auth.onAuthStateChange((event,session)=>{ if(event==='SIGNED_OUT'&&S.user){S.user=null;navigate('login')} });
  if(S.user) await boot(); else navigate('login');
}
init();
</script>
